name: Build and Push fyntrac-gateway to GHCR

on:
  push:
    branches: [ "main" ]
  # Allows you to trigger the workflow manually from the Actions tab
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Matches the image name defined in your build.gradle
  IMAGE_NAME: 19btech/fyntrac/docker/fyntrac-gateway

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Sets the permissions needed to push to GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Optional but good for extracting Gradle properties)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract project version from Gradle
        id: get_version
        run: |
          # Dynamically grabs '0.0.3-SNAPSHOT' from your build.gradle
          VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')
          echo "Extracted version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # Uses the built-in GitHub Actions token, no need for custom secrets
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Compiles for both architectures as requested in your Gradle config
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Utilizes GitHub Actions cache to speed up subsequent Gradle builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
