# ==============================================================================
# SERVER & APPLICATION
# ==============================================================================
server.port=8585
server.forward-headers-strategy=native
spring.application.name=fyntrac-gateway

# ==============================================================================
# SESSION
# ==============================================================================
spring.session.timeout=30m

# ==============================================================================
# ZITADEL OAUTH2 CONFIGURATION
# ==============================================================================
# Registration
spring.security.oauth2.client.registration.zitadel.client-id=${ZITADEL_CLIENT_ID}
spring.security.oauth2.client.registration.zitadel.client-secret=${ZITADEL_CLIENT_SECRET}
#spring.security.oauth2.client.registration.zitadel.scope=openid,profile,email,offline_access,
# urn:zitadel:iam:org:project:id:zitadel:aud
# Add the 'project' scope or the specific client_id of the data-loader as an audience
spring.security.oauth2.client.registration.zitadel.scope=openid,profile,email,offline_access,urn:zitadel:iam:org:project:id:${ZITADEL_PROJECT_ID}:aud
spring.security.oauth2.client.registration.zitadel.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.zitadel.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.zitadel.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Provider
spring.security.oauth2.client.provider.zitadel.issuer-uri=${ZITADEL_ISSUER_URI}
spring.security.oauth2.client.provider.zitadel.user-name-attribute=sub

# ==============================================================================
# GATEWAY ROUTING & TOKEN RELAY
# ==============================================================================
# NOTE: The default TokenRelay filter is NOT used because it relays the
# Access Token.  Our custom TokenRelaySessionFilter (GlobalFilter) relays the
# ID Token instead, which is what the downstream services expect.

# Route: Dataloader / Subledger Service
spring.cloud.gateway.routes[0].id=dataloader-service
spring.cloud.gateway.routes[0].uri=${DATALOADER_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/dataloader/**
spring.cloud.gateway.routes[0].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# Route: Reporting Service
spring.cloud.gateway.routes[1].id=reporting-service
spring.cloud.gateway.routes[1].uri=${REPORTING_SERVICE_URI:http://localhost:8084}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/reporting/**
spring.cloud.gateway.routes[1].filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# ==============================================================================
# FYNTRAC CUSTOM CONFIG
# ==============================================================================
fyntrac.dataloader.base-uri=${DATALOADER_SERVICE_URI:http://localhost:8081}/api/dataloader
fyntrac.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3030}

# ==============================================================================
# MONITORING & LOGGING
# ==============================================================================
# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=when-authorized
management.endpoint.gateway.enabled=true

# Logging Levels
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.fyntrac.gateway=DEBUG